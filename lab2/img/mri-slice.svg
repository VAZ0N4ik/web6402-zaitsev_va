<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <radialGradient id="tissue" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#a7aeb6"/>
      <stop offset="1" stop-color="#78808a"/>
    </radialGradient>
  </defs>

  <!-- фон снимка -->
  <rect width="360" height="360" rx="20" fill="#05080d"/>

  <!-- скальп, кость, мозг -->
  <ellipse cx="175" cy="192" rx="120" ry="142" fill="#6b7178"/>
  <ellipse cx="175" cy="192" rx="112" ry="134" fill="#14181d"/>
  <ellipse cx="175" cy="192" rx="104" ry="126" fill="url(#tissue)"/>

  <!-- межполушарная щель -->
  <path d="M175 66v40M175 282v36" stroke="#2b3138" stroke-width="3" stroke-linecap="round"/>

  <!-- борозды: левое полушарие и его зеркальная копия -->
  <g id="sulci" fill="none" stroke="#565e67" stroke-width="3" stroke-linecap="round">
    <path d="M100 120q14 6 22-6"/>
    <path d="M86 170q16 2 24 12"/>
    <path d="M90 230q14-6 26 4"/>
    <path d="M110 284q12-10 26-6"/>
    <path d="M132 90q8 14 22 14"/>
    <path d="M140 304q6-12 20-14"/>
  </g>
  <use href="#sulci" transform="translate(350 0) scale(-1 1)"/>

  <!-- боковые желудочки (ликвор) -->
  <g id="ventricle" fill="#1d2228">
    <path d="M168 150c-18 4-22 30-18 54 3 16 15 16 18 2 2-16-2-36 4-50z"/>
  </g>
  <use href="#ventricle" transform="translate(350 0) scale(-1 1)"/>

  <!-- очаг: отёк + кольцевидное накопление контраста -->
  <ellipse cx="232" cy="150" rx="27" ry="23" fill="#6a727b"/>
  <circle cx="232" cy="150" r="12" fill="#4a5058" stroke="#f3f5f7" stroke-width="4"/>

  <!-- разметка модели -->
  <rect x="208" y="126" width="48" height="48" fill="none" stroke="#ff8a4c" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M256 126L294 64" stroke="#ff8a4c" stroke-width="1.5"/>
  <rect x="246" y="40" width="98" height="24" rx="6" fill="#05080d" stroke="#ff8a4c"/>
  <text x="295" y="57" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#ff8a4c">очаг · 7 мм</text>

  <!-- служебные надписи, как на DICOM-снимке -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7fe3d9">
    <text x="16" y="28">AX · T1-CE</text>
    <text x="16" y="346">SL 42/128</text>
    <text x="14" y="197">R</text>
    <text x="346" y="197" text-anchor="end">L</text>
  </g>
</svg>
